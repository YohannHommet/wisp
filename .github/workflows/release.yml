name: Release CLI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: wisp-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: wisp-linux-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: wisp-windows-amd64.exe
          - os: macos-14
            target: aarch64-apple-darwin
            asset: wisp-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']))
          version = next(p['version'] for p in metadata['packages'] if p['name'] == 'wisp')
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag and package version differ'
          PY
      - name: Test native release target
        run: cargo test --locked --release --workspace --target ${{ matrix.target }}
      - name: Build native release target
        run: cargo build --locked --release --bin wisp --target ${{ matrix.target }}
      - name: Assemble release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == macOS ]]; then
            rustup target add x86_64-apple-darwin
            cargo build --locked --release --bin wisp --target x86_64-apple-darwin
            lipo -create target/aarch64-apple-darwin/release/wisp target/x86_64-apple-darwin/release/wisp -output "artifacts/$ASSET"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/$TARGET/release/wisp.exe" "artifacts/$ASSET"
          else
            cp "target/$TARGET/release/wisp" "artifacts/$ASSET"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: artifacts/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums and a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum wisp-* > SHA256SUMS
          cat > /tmp/wisp-release-notes.md <<'NOTES'
          Wisp CLI: encrypted, verified file transfers on a local IPv4 network.

          Upgrade both computers. WSP/2 and its pairing codes are incompatible with the 0.1 prototype. The desktop, relay and persistent-pairing experiments are retired.

          Download your binary and SHA256SUMS, then verify the checksum before installing. These binaries are not notarized or platform code-signed.
          NOTES
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "Wisp $RELEASE_TAG" --notes-file /tmp/wisp-release-notes.md wisp-* SHA256SUMS
