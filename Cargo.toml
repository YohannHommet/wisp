[workspace]
resolver = "2"
members = ["crates/wisp-core", "crates/wisp-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Yohann Hommet"]
repository = "https://github.com/YohannHommet/wisp"
description = "Encrypted file transfers between computers on the same network."

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "sync", "time", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
blake3 = "1"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.103"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
local-ip-address = "0.6"
rand = "0.9"
hex = "0.4"
spake2 = "0.4"
subtle = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
toml = "0.8"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
